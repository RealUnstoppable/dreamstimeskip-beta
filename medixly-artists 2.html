<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medixly for Artists</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/medixly.css">
    <style>
        .artist-portal {
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
            color: white;
            font-family: var(--font-primary, 'Inter', sans-serif);
        }
        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .portal-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .upload-section, .library-section {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08);
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: rgba(255,255,255,0.9);
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .search-style-input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1.2rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .search-style-input:focus {
            border-bottom-color: var(--accent-color, #e63995);
        }
        .search-style-input::placeholder {
            color: rgba(255,255,255,0.25);
        }
        
        /* Custom file inputs */
        .file-upload-wrapper {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .file-upload-wrapper:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.4);
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }
        .file-upload-text {
            color: rgba(255,255,255,0.6);
            font-size: 0.95rem;
            pointer-events: none;
        }
        .file-upload-text span {
            color: var(--accent-color, #e63995);
            font-weight: bold;
        }

        .btn-primary {
            background: var(--accent-color, #e63995);
            color: white;
            border: none;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 149, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 149, 0.6);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Lyrics Editor */
        .lyrics-editor {
            margin-top: 40px;
            background: rgba(0,0,0,0.2);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .lyric-line {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .lyric-line:focus-within {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.15);
        }
        
        .lyric-line .search-style-input {
            padding: 5px 0;
            font-size: 1rem;
            border-bottom: none;
        }
        .lyric-line .lyric-text {
            flex: 1;
        }
        .lyric-line .lyric-time {
            width: 80px;
            text-align: center;
            color: var(--accent-color, #e63995);
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 5px 10px;
        }
        
        .sync-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.8);
            border-radius: 50px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sync-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .remove-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0 5px;
        }
        .remove-btn:hover {
            color: #ff4444;
        }

        .audio-preview {
            width: 100%;
            margin: 20px 0;
            border-radius: 50px;
            height: 40px;
        }
        .audio-preview::-webkit-media-controls-panel {
            background-color: rgba(255,255,255,0.1);
        }
        .audio-preview::-webkit-media-controls-current-time-display,
        .audio-preview::-webkit-media-controls-time-remaining-display {
            color: white;
        }

        /* Library Section */
        .library-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            margin-bottom: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .library-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .hidden-badge {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .toggle-hide-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-hide-btn:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <header class="main-header"></header>
    <main class="artist-portal">
        <div class="portal-header">
            <h1>Medixly Artists</h1>
            <button class="btn-primary" id="new-upload-btn" style="box-shadow: none;">+ New Track</button>
        </div>

        <div class="upload-section" id="upload-section" style="display: none;">
            <h2 class="section-title">Upload a Track</h2>
            <div class="form-group">
                <label>Track Title</label>
                <input type="text" id="track-title" class="search-style-input" placeholder="e.g. Midnight City">
            </div>
            <div class="form-group">
                <label>Credits (Producers, Writers)</label>
                <input type="text" id="track-credits" class="search-style-input" placeholder="e.g. Prod. by John Doe">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
                <div class="form-group">
                    <label>Audio File (.mp3, .wav)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="track-file" accept="audio/*">
                        <div class="file-upload-text" id="file-name-display"><span>Browse</span> or drop audio file</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Cover Art (.jpg, .png)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="track-art" accept="image/*">
                        <div class="file-upload-text" id="art-name-display"><span>Browse</span> or drop image</div>
                    </div>
                </div>
            </div>

            <audio id="audio-preview" class="audio-preview" controls style="display: none;"></audio>

            <div class="lyrics-editor">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0;">Lyrics Sync Editor</h3>
                    <button class="btn-secondary" id="add-lyric-btn">+ Add Line</button>
                </div>
                <p style="font-size: 0.9rem; margin-bottom: 25px; color: rgba(255,255,255,0.5);">Play your track and click 'Sync' to stamp the current time for each lyric line.</p>
                
                <div id="lyrics-container"></div>
            </div>

            <div style="margin-top: 40px; text-align: right;">
                <button class="btn-primary" id="publish-btn">Process & Publish</button>
            </div>
        </div>

        <div class="library-section">
            <h2 class="section-title">Your Uploads</h2>
            <div id="artist-library">
                <!-- Populated by JS -->
                <p style="color: rgba(255,255,255,0.5);">Loading your tracks...</p>
            </div>
        </div>
    </main>

    <script type="module" src="/js/theme-loader.js"></script>
    <script type="module">
        import { loadNavbar } from './js/navbar.js';
        loadNavbar();
    </script>
    <script type="module" src="/js/medixly-artists.js"></script>
</body>
</html>
