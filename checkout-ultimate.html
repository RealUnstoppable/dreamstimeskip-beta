<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ultimate Plan | DTS HUB</title>
    <link rel="icon" type="image/png" href="/images/dreams-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/themes.css">
    <style>
        .checkout-main {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 60px; /* More padding top, mobile-first padding */
        }
        
        .checkout-layout {
            display: flex;
            flex-direction: column-reverse; /* Mobile-first: Summary on top */
            gap: 40px;
        }

        .checkout-summary-card, .checkout-payment-card {
            background-color: var(--primary-card-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
        }
        
        /* Desktop: Two-column layout */
        @media (min-width: 768px) {
            .checkout-layout {
                flex-direction: row; /* Two columns */
                gap: 30px;
            }
            .checkout-payment-form {
                flex: 2; /* Payment form takes more space */
            }
            .checkout-summary {
                flex: 1; /* Summary takes less space */
            }
            .checkout-main {
                 padding: 120px 40px 60px; /* Restore desktop padding */
            }
            .checkout-summary-card {
                padding: 30px;
            }
            .checkout-payment-card {
                padding: 40px;
            }
        }

        .checkout-summary-card h2, .checkout-payment-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Summary Box */
        .summary-item {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .summary-item span:first-child {
            color: var(--text-secondary);
        }
        .summary-item span:last-child {
            font-weight: 600;
        }
        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 10px;
        }

        /* Promo Code */
        .promo-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .promo-input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .promo-btn {
            padding: 12px 18px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .promo-btn:hover {
            opacity: 0.8;
        }
        .promo-message {
            font-size: 0.9rem;
            margin-top: 10px;
            color: var(--accent-green);
        }

        /* Payment Buttons */
        .payment-separator {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 30px 0;
        }
        .payment-separator::before, .payment-separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .payment-separator:not(:empty)::before {
            margin-right: .25em;
        }
        .payment-separator:not(:empty)::after {
            margin-left: .25em;
        }

        .payment-btn {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            margin-bottom: 15px;
            text-align: center;
        }
        .btn-stripe {
            background-color: #635bff;
            color: white;
        }
        .btn-apple-pay {
            background-color: #000000;
            color: white;
            border: 1px solid #fff;
        }
        .btn-paypal {
            background-color: #0070ba;
            color: white;
        }
        
        .placeholder-note {
             font-size: 0.8rem;
             color: var(--text-secondary);
             text-align: center;
             margin-top: 20px;
        }

    </style>
</head>
<body>
    
     <header class="main-header">
       
    </header>
</header>
<script type="module">
      import { auth, db } from './js/auth.js';
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"; </script>
    <main class="checkout-main">
        <div class="checkout-layout">

            <section class="checkout-summary">
                <div class="checkout-summary-card">
                    <h2>Order Summary</h2>
                    <div class="summary-item">
                        <span>Ultimate Membership (Monthly - 25% OFF)</span>
                        <span>$14.13</span>
                    </div>
                    <div class="summary-item">
                        <span>Taxes (Est. 8%)</span>
                        <span>$1.13</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span>$15.26</span>
                    </div>
                    
                    <form class="promo-form" id="promo-form">
                        <input type="text" id="promo-code" class="promo-input" placeholder="Promo Code" title="Promo code" aria-label="Promo code">

                    <div class="payment-separator">OR</div>
                    
                    <button class="payment-btn btn-apple-pay">Pay with Apple Pay</button>
                    <button class="payment-btn btn-paypal">Pay with PayPal</button>

                    <p style="font-size: 0.8rem; color: var(--text-secondary, #aaa); margin-top: 15px; text-align: center;">By completing your purchase, you agree to our <a href="terms.html" target="_blank" style="color: var(--accent-color, #14b8a6); text-decoration: underline;">Terms and Conditions</a> and <a href="privacy.html" target="_blank" style="color: var(--accent-color, #14b8a6); text-decoration: underline;">Privacy Policy</a>.</p>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script>
        // Basic promo code simulation
        document.getElementById('promo-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const promoInput = document.getElementById('promo-code');
            const promoMsg = document.getElementById('promo-message');
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;

            btn.disabled = true;
            btn.innerText = 'Applying...';
            promoMsg.style.display = "none";

            setTimeout(() => {
                if (promoInput.value.toUpperCase() === 'TEST10') {
                    promoMsg.textContent = "Promo 'TEST10' applied!";
                    promoMsg.style.color = "var(--accent-green)";
                    promoMsg.style.display = "block";
                } else {
                    promoMsg.textContent = "Invalid promo code.";
                    promoMsg.style.color = "var(--accent-red)";
                    promoMsg.style.display = "block";
                }
                btn.disabled = false;
                btn.innerText = originalText;
            }, 500);
        });
    </script>
    <footer class="main-footer"></footer> 
    <script type="module">
        import { loadNavbar } from './js/navbar.js?v=1791167958698';
        import { loadFooter } from './js/footer.js?v=1791167958698';
        import { auth } from './js/auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        
        if (typeof loadNavbar === 'function') loadNavbar();
        if (typeof loadFooter === 'function') loadFooter();

        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        async function initiateCheckout() {
            if (!currentUser) {
                window.location.href = `sign in beta.html?redirect=${encodeURIComponent(window.location.pathname)}`;
                return;
            }
            const stripeBtn = document.querySelector('.btn-stripe');
            const originalText = stripeBtn ? stripeBtn.textContent : 'Pay $15.26 with Card (Stripe)';
            if (stripeBtn) {
                stripeBtn.textContent = 'Redirecting to checkout...';
                stripeBtn.disabled = true;
            }
            try {
                let token = '';
                if (currentUser) {
                    try { token = await currentUser.getIdToken(); } catch (_) {}
                }
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const payload = {
                    plan: 'ultimate',
                    project: 'dreamstimeskip',
                    uid: currentUser ? currentUser.uid : '',
                    email: currentUser ? currentUser.email : '',
                    successUrl: window.location.origin + '/success.html?status=success&session_id={CHECKOUT_SESSION_ID}',
                    cancelUrl: window.location.href
                };

                let data = null;
                let lastError = null;

                const endpoints = [
                    '/create-checkout-session',
                    '/api/create-checkout-session',
                    'https://us-central1-dts-hub-website.cloudfunctions.net/createCheckoutSession'
                ];

                for (const url of endpoints) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers,
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) {
                            const resData = await response.json();
                            if (resData && resData.url) {
                                data = resData;
                                break;
                            } else if (resData && resData.error) {
                                lastError = resData.error;
                            }
                        } else {
                            try {
                                const errJson = await response.json();
                                if (errJson && errJson.error) {
                                    lastError = errJson.error;
                                }
                            } catch (_) {}
                        }
                    } catch (netErr) {
                        lastError = netErr.message;
                    }
                }

                if (data && data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Error creating checkout session: ' + (lastError || 'An internal server error occurred. Please try again later.'));
                    if (stripeBtn) {
                        stripeBtn.textContent = originalText;
                        stripeBtn.disabled = false;
                    }
                }
            } catch (err) {
                console.error('Checkout error:', err);
                alert('Error connecting to payment server: ' + (err.message || 'Please check your connection.'));
                if (stripeBtn) {
                    stripeBtn.textContent = originalText;
                    stripeBtn.disabled = false;
                }
            }
        }

        document.querySelectorAll('.payment-btn').forEach(btn => {
            btn.addEventListener('click', initiateCheckout);
        });
    </script>
