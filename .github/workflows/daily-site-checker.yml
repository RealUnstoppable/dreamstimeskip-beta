name: Daily Site Health & Status Checker

on:
  schedule:
    # Runs every day at 04:00 UTC (midnight EDT)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  health-check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --prefer-offline --no-audit

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Ecosystem Site Checker
        run: node scripts/site-checker.js --commit --push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
