<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="/js/theme-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | DTS HUB</title>
    <link rel="icon" type="image/png" href="/images/dreams-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/themes.css">
    <style>
        .checkout-main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 20px 80px;
        }

        /* Top Header & Security Badges */
        .checkout-top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .checkout-brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkout-brand-title h1 {
            font-size: 1.85rem;
            font-weight: 800;
            margin: 0;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .checkout-security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 20px;
            color: #10b981;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Stepper */
        .checkout-stepper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .step-item.active {
            color: #fff;
            font-weight: 700;
        }

        .step-item.completed {
            color: var(--accent-green, #10b981);
        }

        .step-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .step-item.active .step-badge {
            background: var(--accent-color, #2563EB);
            color: #fff;
        }

        .step-item.completed .step-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .step-divider {
            width: 25px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Layout */
        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 900px) {
            .checkout-layout {
                grid-template-columns: 1.35fr 1fr;
                align-items: start;
            }
        }

        /* Cards */
        .checkout-form-container, .checkout-summary-container {
            background: linear-gradient(180deg, rgba(24, 24, 28, 0.95) 0%, rgba(18, 18, 22, 0.92) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        }

        .checkout-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .checkout-section-header h2, .checkout-section-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }

        .section-num {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--accent-color, #2563EB);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 800;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary, #aaa);
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(10, 10, 12, 0.8);
            color: #fff;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-color, #2563EB);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            background: rgba(15, 15, 20, 0.95);
        }

        .form-group-inline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Test Mode Box */
        .test-mode-box {
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.25);
            border-radius: 12px;
            padding: 14px 18px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .test-mode-box-text {
            color: #fde047;
            font-size: 0.88rem;
            margin: 0;
        }

        .fill-test-btn {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid rgba(234, 179, 8, 0.4);
            color: #fef08a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fill-test-btn:hover {
            background: rgba(234, 179, 8, 0.35);
        }

        /* Order Summary Items */
        .summary-item-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .summary-item-img {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border-radius: 10px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-item-details {
            flex: 1;
            min-width: 0;
        }

        .summary-item-title {
            font-weight: 600;
            color: #fff;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-item-qty {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .summary-item-price {
            font-weight: 700;
            color: #fff;
            font-size: 1rem;
        }

        /* Financial rows */
        .summary-calculation {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .summary-calc-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .summary-calc-row strong, .summary-calc-row span:last-child {
            color: #fff;
        }

        .summary-calc-total {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .summary-calc-total span:first-child {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .summary-calc-total span:last-child {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .place-order-button {
            width: 100%;
            font-size: 1.1rem;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--accent-color, #2563EB) 0%, #1d4ed8 100%);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .place-order-button:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.55);
        }

        .place-order-button:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .trust-badges-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <header class="main-header"></header>

    <main class="checkout-main" id="checkout-container">
        <h1>Loading Checkout...</h1>
    </main>
    <script src="/js/script.js"></script>
    <script type="module" src="/js/checkout.js?v=1791167958698"></script>
     
    <script type="module">
        import { loadNavbar } from './js/navbar.js?v=1791167958698';
        import { loadFooter } from './js/footer.js?v=1791167958698';
        
        if (typeof loadNavbar === 'function') loadNavbar();
        if (typeof loadFooter === 'function') loadFooter();
    </script>

    <footer class="main-footer"></footer>
</body>
</html>
