<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3d0a0a"/>
      <stop offset="60%" stop-color="#140202"/>
      <stop offset="100%" stop-color="#050000"/>
    </radialGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="50%" stop-color="#dd1122"/>
      <stop offset="100%" stop-color="#880011"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="32" fill="url(#bgGlow)"/>
  
  <!-- Stylized vinyl and geometric accents -->
  <circle cx="256" cy="220" r="140" stroke="#ff2233" stroke-opacity="0.15" stroke-width="2" fill="none"/>
  <circle cx="256" cy="220" r="110" stroke="#ff2233" stroke-opacity="0.3" stroke-width="3" fill="none"/>
  <circle cx="256" cy="220" r="80" stroke="#ff2233" stroke-opacity="0.5" stroke-width="4" fill="none"/>
  <circle cx="256" cy="220" r="40" fill="#dd1122" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="14" fill="#ffffff"/>

  <!-- Cross / Phonk dagger icons -->
  <text x="256" y="115" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ff2233" text-anchor="middle" letter-spacing="4" filter="url(#glow)">†</text>

  <!-- Title -->
  <text x="256" y="390" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">KRUSHDAFIGHT!</text>
  
  <!-- Artist -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ff4455" text-anchor="middle" letter-spacing="3">N2UTHARTLOCKER</text>
  
  <!-- Tag -->
  <rect x="186" y="455" width="140" height="24" rx="12" fill="#2a0808" stroke="#dd1122" stroke-width="1.5"/>
  <text x="256" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">BRAZILIAN PHONK</text>
</svg>
